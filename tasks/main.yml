---
- name: Install Java 21 via Chocolatey
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ ludus_jenkins_agent_java_package }}"
    state: present

- name: Create Jenkins agent user
  ansible.windows.win_user:
    name: "{{ ludus_jenkins_agent_user }}"
    password: "{{ ludus_jenkins_agent_password }}"
    state: present
    groups:
      - Administrators
    password_never_expires: true
    user_cannot_change_password: true

- name: Grant the agent account the 'Log on as a service' right
  # A service running under a custom account must hold SeServiceLogonRight or
  # Windows refuses to start it ("Failed to start service"). Membership in
  # Administrators does not grant this implicitly.
  ansible.windows.win_user_right:
    name: SeServiceLogonRight
    users:
      - ".\\{{ ludus_jenkins_agent_user }}"
    action: add

- name: Create agent work directory
  ansible.windows.win_file:
    path: "{{ ludus_jenkins_agent_workdir }}"
    state: directory

- name: Download Jenkins agent JAR
  ansible.windows.win_get_url:
    url: "{{ ludus_jenkins_url }}/jnlpJars/agent.jar"
    dest: "{{ ludus_jenkins_agent_workdir }}\\agent.jar"
    validate_certs: false

- name: Template agent launch script
  ansible.windows.win_template:
    src: jenkins-agent.ps1.j2
    dest: "{{ ludus_jenkins_agent_workdir }}\\start-agent.ps1"

- name: Install NSSM for service management
  chocolatey.chocolatey.win_chocolatey:
    name: nssm
    state: present

- name: Locate the installed java.exe
  ansible.windows.win_shell: |
    $roots = @(
      "$env:ProgramFiles\Eclipse Adoptium",
      "$env:ProgramFiles\Microsoft",
      "$env:ProgramFiles\OpenJDK",
      "$env:ProgramFiles\Java"
    )
    $java = Get-ChildItem -Path $roots -Filter java.exe -Recurse -ErrorAction SilentlyContinue |
      Where-Object { $_.FullName -match '\\bin\\java\.exe$' -and $_.FullName -match 'jdk-?{{ ludus_jenkins_java_version }}' } |
      Select-Object -First 1 -ExpandProperty FullName
    if (-not $java) { throw "Could not locate a JDK {{ ludus_jenkins_java_version }} java.exe under Program Files" }
    $java
  register: ludus_jenkins_agent_java_exe
  changed_when: false

- name: Fetch this agent's inbound connection secret from the controller
  # Inbound agents require a per-node secret. The stable way to obtain it is the
  # node's JNLP descriptor (getJnlpMac() via Groovy broke in Jenkins 2.427+).
  # Requires the controller to have already created a matching static node
  # (ludus_jenkins_static_agents) — a 404 here means that node is missing.
  ansible.windows.win_uri:
    url: "{{ ludus_jenkins_url }}/computer/{{ ludus_jenkins_agent_name }}/jenkins-agent.jnlp"
    method: GET
    url_username: "{{ ludus_jenkins_admin_user }}"
    url_password: "{{ ludus_jenkins_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    return_content: true
  register: ludus_jenkins_agent_jnlp
  until: ludus_jenkins_agent_jnlp.status_code == 200
  retries: 15
  delay: 8
  changed_when: false

- name: Extract the connection secret from the JNLP descriptor
  # The secret is the first <argument> in the JNLP descriptor.
  ansible.builtin.set_fact:
    ludus_jenkins_agent_secret: "{{ (ludus_jenkins_agent_jnlp.content | regex_findall('<argument>([^<]+)</argument>'))[0] }}"

- name: Create Jenkins agent Windows service
  # Recreated every run so config changes (java path, credentials, url) always
  # take effect. The previous `creates: agent-stdout.log` guard keyed idempotency
  # on a runtime log file, which permanently pinned the service to its first
  # (possibly broken) configuration. Tear down any existing service first so a
  # stale or stuck (e.g. paused) service is replaced cleanly.
  ansible.windows.win_shell: |
    if (Get-Service JenkinsAgent -ErrorAction SilentlyContinue) {
      nssm stop JenkinsAgent | Out-Null
      nssm remove JenkinsAgent confirm | Out-Null
    }
    nssm install JenkinsAgent "{{ ludus_jenkins_agent_java_exe.stdout | trim }}" `
      "-jar" "{{ ludus_jenkins_agent_workdir }}\agent.jar" `
      "-url" "{{ ludus_jenkins_url }}" `
      "-name" "{{ ludus_jenkins_agent_name }}" `
      "-secret" "{{ ludus_jenkins_agent_secret }}" `
      "-workDir" "{{ ludus_jenkins_agent_workdir }}" `
      "-webSocket"
    nssm set JenkinsAgent ObjectName ".\{{ ludus_jenkins_agent_user }}" "{{ ludus_jenkins_agent_password }}"
    nssm set JenkinsAgent AppStdout "{{ ludus_jenkins_agent_workdir }}\agent-stdout.log"
    nssm set JenkinsAgent AppStderr "{{ ludus_jenkins_agent_workdir }}\agent-stderr.log"
    nssm set JenkinsAgent Start SERVICE_AUTO_START

- name: Create firewall rule for Jenkins agent
  community.windows.win_firewall_rule:
    name: Jenkins Agent
    direction: in
    action: allow
    localport: 50000
    protocol: tcp
    state: present
    enabled: true

- name: Start Jenkins agent service
  ansible.windows.win_service:
    name: JenkinsAgent
    state: started
    start_mode: auto
